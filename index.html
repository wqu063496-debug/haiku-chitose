
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d25">
<title>俳句を作ろう</title>
<style>
:root{color-scheme:dark;--ink:#f5f3ff;--muted:#c7c9e8;--gold:#ffe8a3;--panel:rgba(14,20,55,.78)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 0%,#26366c 0,#111a42 35%,#070b20 78%);overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.wrap{width:min(760px,92vw);margin:0 auto;padding:36px 0 56px}
.hero{text-align:center;padding:22px 10px 14px}
h1{font-size:clamp(2rem,7vw,3.4rem);letter-spacing:.08em;margin:0 0 12px;text-shadow:0 0 22px #9eaaff}
.intro{line-height:1.9;color:#e0e5ff;margin:0 auto 20px}
.panel{background:var(--panel);border:1px solid #7f8ad6a8;border-radius:24px;padding:clamp(18px,5vw,32px);box-shadow:0 18px 60px #0005;backdrop-filter:blur(9px);margin:18px 0}
.small{font-size:.9rem;color:var(--muted)}
.label{display:block;margin:12px 0 7px;font-weight:700}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #9ba8ef;background:#090f2c;color:white;font:inherit}
button{font:inherit;font-weight:750;border:0;border-radius:999px;padding:12px 20px;cursor:pointer;transition:transform .15s,filter .15s}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}
button:focus-visible,input:focus-visible{outline:3px solid #ffe8a3;outline-offset:3px}
.primary{background:linear-gradient(135deg,#ffe8a3,#f5b8e9);color:#171633;box-shadow:0 5px 22px #d5b4ff44}
.secondary{background:#242f65;color:white;border:1px solid #8290e8}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.poem{font-size:clamp(1.35rem,5vw,2rem);font-weight:750;line-height:1.9;text-align:center;white-space:pre-line;min-height:120px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff5ce}
.author{text-align:right;color:#d6d9ff;margin-top:12px}
.love{white-space:pre-line;text-align:center;font-size:1.2rem;line-height:1.8;color:#ffdce9;margin-top:18px}
.hidden{display:none!important}
.notice{border:1px solid #ffe8a3;border-radius:16px;padding:16px;text-align:center;background:#3a2c58;color:#fff2c7;margin-top:16px}
.game-area{height:230px;position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(#111c4c,#25205a);border:1px solid #7c8be4;margin-top:14px;touch-action:manipulation}
.ore{position:absolute;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;font-size:2rem;background:radial-gradient(circle at 35% 25%,#fff,#8ef8ff 25%,#7664ff 62%,#25235c);box-shadow:0 0 24px #8cfbff;cursor:pointer;user-select:none}
.score{text-align:center;font-size:1.1rem;margin:10px}
.footer{text-align:center;color:#9da7d9;font-size:.82rem;margin-top:28px}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<main class="wrap">
<header class="hero">
<h1>俳句を作ろう</h1>
<p class="intro">五・七・五で、今日の気持ちを詠んでみよう。<br>そして今日も、チトセさんへの愛は字余り。</p>
</header>

<section class="panel">
<p class="small">ボタンを押すと、星空の下で一句が生まれます。</p>
<label class="label" for="authorName">俳句の作者名（任意）</label>
<input id="authorName" maxlength="24" placeholder="名前を入力（空欄でもOK）" autocomplete="nickname">
<div class="actions"><button class="primary" id="drawBtn">俳句を作る</button></div>

<div id="poemArea" class="hidden" aria-live="polite">
<div class="poem" id="poem"></div>
<div class="author" id="signature"></div>
<div class="love" id="love"></div>
<div class="actions">
<button class="secondary" id="againBtn">もう一度作る</button>
<button class="secondary" id="shareBtn">画像を作って共有</button>
</div>
</div>

<div id="rareNotice" class="notice hidden">
<strong>✨ チトセニウムが発生した！ ✨</strong>
<p>タップしてチトセニウムを集めよう！</p>
<button class="primary" id="startGame">ミニゲーム開始</button>
</div>
</section>

<section id="gamePanel" class="panel hidden">
<h2 style="text-align:center">チトセニウム採集ゲーム</h2>
<p class="small" style="text-align:center">光るチトセニウムをタップ！ 制限時間内にたくさん集めよう。</p>
<div class="score">残り <b id="time">15</b> 秒　｜　収集数 <b id="score">0</b></div>
<div class="game-area" id="gameArea" aria-label="チトセニウムをタップするエリア"></div>
<p id="gameResult" class="love"></p>
<div class="actions"><button class="secondary" id="retryGame">もう一度遊ぶ</button></div>
</section>

<footer class="footer">星空の下で、あなたの一句を。</footer>
</main>

<script>
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');let stars=[];
function makeStars(){
 canvas.width=innerWidth*devicePixelRatio;
 canvas.height=innerHeight*devicePixelRatio;
 canvas.style.width=innerWidth+'px';
 canvas.style.height=innerHeight+'px';
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 stars=Array.from({length:Math.min(180,Math.floor(innerWidth/5))},()=>({
  x:Math.random()*innerWidth,y:Math.random()*innerHeight,
  r:Math.random()*1.5+.25,a:Math.random()*.7+.2,phase:Math.random()*6
 }));
}
function drawStars(){
 ctx.clearRect(0,0,innerWidth,innerHeight);
 const t=Date.now()/900;
 for(const s of stars){
  ctx.globalAlpha=s.a*(.65+.35*Math.sin(t+s.phase));
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;requestAnimationFrame(drawStars);
}
addEventListener('resize',makeStars);makeStars();drawStars();

const poems=[
 '風吹けば\n星に願いを\nそっと乗せ',
 '夜空には\n君の笑顔が\n星明かり',
 '月明かり\n心の一句\n君に詠む',
 '秋の夜\n言葉を探す\n星の下'
];

const loves=[
 'それでも宵谷チトセは\n可愛い（字余り）',
 'それはともかく宵谷チトセは\n今日もメロい（字余り）',
 'そんなときにも響く\nチトセの美声（字余り）'
];

let rare=false,gameTimer=null,score=0,timeLeft=15;

function drawPoem(){
 const p=poems[Math.floor(Math.random()*poems.length)];
 document.getElementById('poem').textContent=p.replaceAll('恋','愛');
 document.getElementById('signature').textContent='— '+(document.getElementById('authorName').value.trim()||'名もなき詠み人');
 document.getElementById('love').textContent=loves[Math.floor(Math.random()*loves.length)].replaceAll('恋','愛');
 document.getElementById('poemArea').classList.remove('hidden');
 document.getElementById('rareNotice').classList.add('hidden');
 document.getElementById('gamePanel').classList.add('hidden');
 rare=Math.floor(Math.random()*100)===0;
 if(rare)document.getElementById('rareNotice').classList.remove('hidden');
}
document.getElementById('drawBtn').addEventListener('click',drawPoem);
document.getElementById('againBtn').addEventListener('click',drawPoem);

function startGame(){
 document.getElementById('gamePanel').classList.remove('hidden');
 document.getElementById('gameResult').textContent='';
 document.getElementById('gameArea').innerHTML='';
 score=0;timeLeft=15;updateScore();spawnOre();clearInterval(gameTimer);
 gameTimer=setInterval(()=>{
  timeLeft--;updateScore();
  if(timeLeft<=0){
   clearInterval(gameTimer);document.getElementById('gameArea').innerHTML='';
   const win=score>=10;
   document.getElementById('gameResult').textContent=win?'🎉 称号獲得：チトセニウム収集家！':'終了！ '+score+'個集めたよ。10個以上で称号ゲット！';
   if(win)localStorage.setItem('chitoseCollector','true');
  }
 },1000);
 document.getElementById('gamePanel').scrollIntoView({behavior:'smooth',block:'center'});
}
function updateScore(){
 document.getElementById('time').textContent=timeLeft;
 document.getElementById('score').textContent=score;
}
function spawnOre(){
 const area=document.getElementById('gameArea');
 if(timeLeft<=0)return;
 const ore=document.createElement('button');
 ore.className='ore';ore.type='button';ore.textContent='✦';
 ore.setAttribute('aria-label','チトセニウムを集める');
 ore.style.left=Math.random()*Math.max(0,area.clientWidth-62)+'px';
 ore.style.top=Math.random()*Math.max(0,area.clientHeight-62)+'px';
 ore.addEventListener('click',()=>{
  if(timeLeft<=0)return;
  score++;updateScore();ore.remove();spawnOre();
 },{once:true});
 area.appendChild(ore);
 setTimeout(()=>{if(ore.isConnected){ore.remove();spawnOre()}},850);
}
document.getElementById('startGame').addEventListener('click',startGame);
document.getElementById('retryGame').addEventListener('click',startGame);

document.getElementById('shareBtn').addEventListener('click',async()=>{
 const c=document.createElement('canvas');c.width=1200;c.height=900;
 const g=c.getContext('2d');
 const grad=g.createLinearGradient(0,0,1200,900);
 grad.addColorStop(0,'#111b48');grad.addColorStop(1,'#080b20');
 g.fillStyle=grad;g.fillRect(0,0,1200,900);
 for(let i=0;i<180;i++){
  g.fillStyle='rgba(255,255,255,'+(Math.random()*.8+.2)+')';
  g.beginPath();g.arc(Math.random()*1200,Math.random()*900,Math.random()*2+0.5,0,Math.PI*2);g.fill();
 }
 g.textAlign='center';g.fillStyle='#fff2c7';g.font='bold 62px sans-serif';
 g.fillText('俳句を作ろう',600,145);
 g.fillStyle='#fff';g.font='bold 42px sans-serif';
 const lines=document.getElementById('poem').textContent.split('\n');
 lines.forEach((l,i)=>g.fillText(l,600,300+i*70));
 g.fillStyle='#d8dcff';g.font='30px sans-serif';
 g.fillText(document.getElementById('signature').textContent,900,500);
 g.fillStyle='#ffdce9';g.font='bold 36px sans-serif';
 document.getElementById('love').textContent.split('\n').forEach((l,i)=>g.fillText(l,600,610+i*58));
 g.fillStyle='#aab5f4';g.font='22px sans-serif';
 g.fillText('星空の下で、あなたの一句を。',600,820);
 c.toBlob(async blob=>{
  if(!blob)return;
  const file=new File([blob],'haiku.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
   try{await navigator.share({files:[file],title:'俳句を作ろう',text:'一句できました！'});return}
   catch(e){if(e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='haiku.png';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  alert('画像を保存しました。Xなどに添付して共有できます。');
 },'image/png');
});
</script>
</body>
</html>
